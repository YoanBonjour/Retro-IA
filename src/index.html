<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SYSTEME 84</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="terminal">
      <!-- <h1>Terminal</h1> -->
      <div class="crt" aria-hidden="true"></div>
      <div class="crt-tube" aria-hidden="true"></div>
      <div id="statusbar" class="terminal__status">VERIFICATION...</div>
      <div id="log" class="terminal__log"></div>
      <div class="terminal__line">
        <div class="terminal__inline">
          <span class="terminal__prompt">&gt;</span>
          <textarea
            maxlength="100"
            id="input"
            class="terminal__input"
            rows="1"
            autocomplete="off"
            spellcheck="false"
            autofocus
          ></textarea>
        </div>
      </div>
    </main>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
